<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiCatálogo - Sin conexión</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);
      color: white;
      text-align: center;
      padding: 20px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 2rem;
    }
    p {
      margin: 0 0 20px 0;
      opacity: 0.9;
    }
    button {
      background: white;
      color: #ec4899;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="icon">📱</div>
  <h1>Sin conexión a internet</h1>
  <p>MultiCatálogo necesita conexión para funcionar.</p>
  <button onclick="window.location.reload()">Reintentar</button>
</body>
</html>
